<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTANT-SAT-Quiz — Linux Fundamentals & Cybersecurity</title>
<style>
  :root{
    --bg: #0a0e10;
    --panel: #10161b;
    --panel-2: #141b21;
    --border: #1c262d;
    --text: #d7e0e4;
    --muted: #64777f;
    --prompt: #39d98a;
    --low: #2dd4bf;
    --med: #f5a623;
    --hard: #ef4565;
    --mono: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(45,212,191,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(239,69,101,0.05), transparent 40%);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding: 40px 16px;
  }

  .term{
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .term-bar{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 10px 14px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .dot{ width:11px; height:11px; border-radius:50%; transition: background .3s; }
  .dot.d1{ background:#3a4650; }
  .dot.d2{ background:#3a4650; }
  .dot.d3{ background:#3a4650; }
  .dot.active{ background: var(--dotcolor, var(--low)); box-shadow: 0 0 8px var(--dotcolor, var(--low)); }

  .term-title{
    margin-left: 6px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  .term-title b{ color: var(--prompt); }

  .term-body{ padding: 22px 24px 26px; }

  .hop-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .hop-row .diff-tag{
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .diff-tag.LOW{ color: var(--low); border: 1px solid var(--low); }
  .diff-tag.MEDIUM{ color: var(--med); border: 1px solid var(--med); }
  .diff-tag.HARD{ color: var(--hard); border: 1px solid var(--hard); }

  .packets{
    display:flex;
    gap: 4px;
    margin-bottom: 22px;
  }
  .packet{
    height: 5px;
    flex: 1;
    background: #1c262d;
    border-radius: 2px;
    overflow:hidden;
  }
  .packet.answered{ background: var(--prompt); opacity: 0.55; }
  .packet.current{ background: var(--prompt); opacity: 1; }

  .prompt-line{
    color: var(--prompt);
    font-size: 13px;
    margin-bottom: 4px;
  }
  .prompt-line .path{ color: #6ee7b7; }
  .prompt-line .cmd{ color: var(--text); }

  .scenario{
    font-size: 12.5px;
    line-height: 1.6;
    color: #a9b8bf;
    background: rgba(255,255,255,0.02);
    border-left: 2px solid var(--muted);
    padding: 10px 12px;
    margin: 10px 0 14px;
  }

  h1.q{
    font-size: 15.5px;
    line-height: 1.55;
    font-weight: 500;
    margin: 0 0 20px;
    color: var(--text);
  }

  .choices{ display:flex; flex-direction:column; gap:10px; }

  .choice{
    text-align:left;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 13.5px;
    cursor:pointer;
    display:flex;
    gap: 10px;
    align-items:flex-start;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .choice:hover{
    border-color: #33424b;
    background:#161f25;
    transform: translateX(2px);
  }
  .choice .tag{
    color: var(--muted);
    flex-shrink:0;
  }
  .choice.selected{
    border-color: var(--prompt);
    background: rgba(57,217,138,0.08);
  }

  .choice.correct{
    border-color: var(--low);
    background: rgba(45,212,191,0.08);
  }
  .choice.incorrect{
    border-color: var(--hard);
    background: rgba(239,69,101,0.08);
  }
  .choice.dim{ opacity: 0.45; }
  .choice.static{ cursor:default; }
  .choice.static:hover{ transform:none; background: var(--panel-2); border-color: var(--border); }

  .explain{
    margin-top: 14px;
    padding: 12px 14px;
    border-left: 2px solid var(--muted);
    background: rgba(255,255,255,0.02);
    font-size: 12.5px;
    line-height: 1.6;
    color: #a9b8bf;
  }
  .explain b{ color: var(--text); }

  .footer-row{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 20px;
  }

  .score-mini{ font-size: 12px; color: var(--muted); }
  .score-mini b{ color: var(--text); }

  .nav-btns{ display:flex; gap:8px; }

  .btn{
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 8px 16px;
    border-radius: 5px;
    cursor:pointer;
    letter-spacing: 0.5px;
    transition: opacity .2s, border-color .2s, color .2s;
  }
  .btn:hover{ border-color: #3a4650; color: var(--text); }
  .btn:disabled{ opacity: 0.3; cursor: not-allowed; }

  .next-btn{
    border: 1px solid var(--prompt);
    color: var(--prompt);
  }
  .next-btn:hover{ background: rgba(57,217,138,0.1); color: var(--prompt); }

  .submit-btn{
    border: 1px solid var(--hard);
    color: var(--hard);
  }
  .submit-btn:hover{ background: rgba(239,69,101,0.1); color: var(--hard); }

  /* results screen */
  .results h2{
    font-size: 18px;
    color: var(--text);
    margin: 4px 0 2px;
  }
  .results .sub{ color: var(--muted); font-size: 12.5px; margin-bottom: 22px; }

  .bigscore{
    font-size: 46px;
    font-weight: 700;
    color: var(--prompt);
    line-height: 1;
    margin-bottom: 4px;
  }
  .bigscore span{ font-size: 20px; color: var(--muted); font-weight: 400; }

  .breakdown{ margin: 24px 0; display:flex; flex-direction:column; gap:12px; }
  .brow{ display:flex; align-items:center; gap:12px; font-size: 12.5px; }
  .brow .label{ width: 74px; flex-shrink:0; font-weight:700; letter-spacing:1px; }
  .brow .bar-bg{ flex:1; height:8px; background:#1c262d; border-radius:4px; overflow:hidden; }
  .brow .bar-fill{ height:100%; border-radius:4px; }
  .brow .count{ width: 44px; text-align:right; color: var(--muted); }

  .verdict{
    font-size: 12.5px;
    color: #a9b8bf;
    line-height: 1.6;
    padding: 12px 14px;
    background: rgba(255,255,255,0.02);
    border-left: 2px solid var(--prompt);
    margin-bottom: 22px;
  }

  .review-toggle{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px;
    border-radius: 6px;
    cursor:pointer;
    margin-bottom: 10px;
  }
  .review-toggle:hover{ border-color: var(--prompt); color: var(--prompt); }

  .review-list{ display:none; flex-direction:column; gap:14px; margin: 16px 0; }
  .review-list.show{ display:flex; }

  .review-item{
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    background: var(--panel-2);
  }
  .review-item .rhead{
    display:flex;
    justify-content: space-between;
    align-items:center;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .review-item .rq{ font-size: 13px; margin-bottom: 8px; color: var(--text); }
  .review-item .ryour{ font-size: 12px; margin-bottom: 4px; }
  .review-item .rcorrect{ font-size: 12px; margin-bottom: 8px; }
  .review-item .rexplain{ font-size: 12px; color: #a9b8bf; line-height: 1.5; }
  .status-ok{ color: var(--low); }
  .status-bad{ color: var(--hard); }

  .restart-btn{
    width:100%;
    margin-top: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px;
    border-radius: 6px;
    cursor:pointer;
  }
  .restart-btn:hover{ border-color: var(--prompt); color: var(--prompt); }

  @media (prefers-reduced-motion: reduce){
    .choice, .btn, .dot{ transition:none; }
  }

  @media (max-width: 480px){
    .term-body{ padding: 18px 16px 22px; }
    h1.q{ font-size: 14px; }
  }
</style>
</head>
<body>

<div class="term" id="term">
  <div class="term-bar">
    <div class="dot d1" id="dot1"></div>
    <div class="dot d2" id="dot2"></div>
    <div class="dot d3" id="dot3"></div>
    <div class="term-title"><b>INSTANT-SW-Quiz</b> — root@kali: ~/linux-fundamentals</div>
  </div>
  <div class="term-body" id="termBody"></div>
</div>

<script>
const QUESTIONS_RAW = [
  {
    difficulty: "LOW",
    scenario: "You have just opened the Linux terminal and want to know your current location in the file system.",
    q: "Which command displays the current working directory?",
    choices: ["pwd","ls","cd","whoami"],
    correct: 0,
    explain: "<b>pwd</b> prints the current working directory."
  },
  {
    difficulty: "LOW",
    scenario: "You want to see the files and folders inside the current directory.",
    q: "Which command lists files and directories?",
    choices: ["ls","pwd","mkdir","cat"],
    correct: 0,
    explain: "<b>ls</b> lists files and directories."
  },
  {
    difficulty: "LOW",
    scenario: "You need to move into another directory.",
    q: "Which command changes the current directory?",
    choices: ["cd","pwd","touch","mv"],
    correct: 0,
    explain: "<b>cd</b> changes your current directory."
  },
  {
    difficulty: "LOW",
    scenario: "You want to create an empty file called notes.txt.",
    q: "Which command creates an empty file?",
    choices: ["touch","mkdir","rm","cp"],
    correct: 0,
    explain: "<b>touch</b> creates an empty file if it doesn't exist."
  },
  {
    difficulty: "LOW",
    scenario: "You need a new folder for your project.",
    q: "Which command creates a new directory?",
    choices: ["mkdir","touch","ls","cat"],
    correct: 0,
    explain: "<b>mkdir</b> creates a new directory."
  },
  {
    difficulty: "LOW",
    scenario: "A file is no longer needed.",
    q: "Which command removes a file?",
    choices: ["rm","mv","cp","cat"],
    correct: 0,
    explain: "<b>rm</b> removes files."
  },
  {
    difficulty: "LOW",
    scenario: "You are navigating directories.",
    q: "What does '..' represent?",
    choices: ["Parent directory","Current directory","Root directory","Home directory"],
    correct: 0,
    explain: "<b>..</b> refers to the parent directory."
  },
  {
    difficulty: "LOW",
    scenario: "You are already inside a directory.",
    q: "What does '.' represent?",
    choices: ["Current directory","Parent directory","Home directory","Root directory"],
    correct: 0,
    explain: "<b>.</b> refers to the current directory."
  },
  {
    difficulty: "LOW",
    scenario: "You want to display the contents of a text file.",
    q: "Which command displays the contents of a file?",
    choices: ["cat","pwd","rm","mv"],
    correct: 0,
    explain: "<b>cat</b> displays file contents."
  },
  {
    difficulty: "LOW",
    scenario: "You want to duplicate a file.",
    q: "Which command copies a file?",
    choices: ["cp","mv","rm","touch"],
    correct: 0,
    explain: "<b>cp</b> copies files."
  },
  {
    difficulty: "LOW",
    scenario: "You want to rename a file.",
    q: "Which command moves or renames a file?",
    choices: ["mv","cp","rm","cat"],
    correct: 0,
    explain: "<b>mv</b> moves or renames files."
  },
  {
    difficulty: "LOW",
    scenario: "You need more details about files.",
    q: "Which command shows detailed file information?",
    choices: ["ls -l","pwd","touch","cd"],
    correct: 0,
    explain: "<b>ls -l</b> displays detailed information including permissions."
  },
  {
    difficulty: "MEDIUM",
    scenario: "You are checking Linux file permissions.",
    q: "What do the letters 'rwx' represent?",
    choices: ["Read, Write, Execute","Run, Work, Exit","Read, Work, Execute","Rename, Write, Execute"],
    correct: 0,
    explain: "<b>r</b>=Read, <b>w</b>=Write, <b>x</b>=Execute."
  },
  {
    difficulty: "MEDIUM",
    scenario: "You need to modify the permissions of a file.",
    q: "Which command changes file permissions?",
    choices: ["chmod","chown","ls","rm"],
    correct: 0,
    explain: "<b>chmod</b> changes file permissions."
  },
  {
    difficulty: "MEDIUM",
    scenario: "A file has permission number 7.",
    q: "What does permission 7 mean?",
    choices: ["Read + Write + Execute","Read only","Write only","Read + Execute"],
    correct: 0,
    explain: "Permission <b>7 = rwx</b>."
  },
  {
    difficulty: "MEDIUM",
    scenario: "You are learning the Linux file system.",
    q: "Which symbol represents the root directory?",
    choices: ["/","~",".",".."],
    correct: 0,
    explain: "<b>/</b> is the root directory."
  },
  {
    difficulty: "LOW",
    scenario: "You are starting your cybersecurity journey.",
    q: "What is the main purpose of Cybersecurity?",
    choices: [
      "Protect systems, networks, and data",
      "Speed up computers",
      "Install software",
      "Increase internet speed"
    ],
    correct: 0,
    explain: "Cybersecurity focuses on protecting systems, networks, and information."
  },
  {
    difficulty: "MEDIUM",
    scenario: "You are creating an account on an online service.",
    q: "Which of the following is the strongest password?",
    choices: [
      "M0h@b!2026",
      "123456",
      "password",
      "mohamed123"
    ],
    correct: 0,
    explain: "Strong passwords use uppercase, lowercase, numbers, and special characters."
  },
  {
    difficulty: "MEDIUM",
    scenario: "A hacker keeps trying many passwords until one works.",
    q: "What is this attack called?",
    choices: [
      "Brute Force",
      "Phishing",
      "SQL Injection",
      "DDoS"
    ],
    correct: 0,
    explain: "A Brute Force attack repeatedly tries many passwords."
  },
  {
    difficulty: "HARD",
    scenario: "You are logged into Linux as the root user.",
    q: "Why should you avoid working as root unless necessary?",
    choices: [
      "You can accidentally damage the system",
      "It makes Linux slower",
      "It disables the internet",
      "It automatically deletes files"
    ],
    correct: 0,
    explain: "The root user has full privileges, so mistakes can seriously affect the system."
  }
];

// Shuffle helper (Fisher-Yates)
function shuffleArray(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Build the runtime question list with choices shuffled per-question,
// so the correct answer isn't always in the same position (e.g. "A").
const QUESTIONS = QUESTIONS_RAW.map(item => {
  const correctText = item.choices[item.correct];
  const shuffledChoices = shuffleArray(item.choices);
  return {
    ...item,
    choices: shuffledChoices,
    correct: shuffledChoices.indexOf(correctText)
  };
});

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let submitted = false;

const diffColor = { LOW: "var(--low)", MEDIUM: "var(--med)", HARD: "var(--hard)" };
const body = document.getElementById("termBody");

function renderQuestion(){
  const item = QUESTIONS[current];
  const dotEls = [document.getElementById("dot1"), document.getElementById("dot2"), document.getElementById("dot3")];
  dotEls.forEach(d => d.classList.remove("active"));
  const dotIndex = item.difficulty === "LOW" ? 0 : item.difficulty === "MEDIUM" ? 1 : 2;
  dotEls[dotIndex].classList.add("active");
  dotEls[dotIndex].style.setProperty("--dotcolor", diffColor[item.difficulty]);

  const packetsHTML = QUESTIONS.map((_, i) => {
    let cls = "packet";
    if (i === current) cls += " current";
    else if (answers[i] !== null) cls += " answered";
    return `<div class="${cls}"></div>`;
  }).join("");

  const choicesHTML = item.choices.map((c, i) => {
    const sel = answers[current] === i ? " selected" : "";
    return `<button class="choice${sel}" data-i="${i}"><span class="tag">[${String.fromCharCode(65+i)}]</span><span>${c}</span></button>`;
  }).join("");

  const answeredCount = answers.filter(a => a !== null).length;
  const isLast = current === QUESTIONS.length - 1;

  body.innerHTML = `
    <div class="hop-row">
      <span>question ${current+1}/${QUESTIONS.length}</span>
      <span class="diff-tag ${item.difficulty}">${item.difficulty}</span>
    </div>
    <div class="packets">${packetsHTML}</div>
    <div class="prompt-line"><span class="path">~/quiz</span> <span class="cmd">$ cat scenario_${current+1}.txt</span></div>
    <div class="scenario">${item.scenario}</div>
    <h1 class="q">${item.q}</h1>
    <div class="choices">${choicesHTML}</div>
    <div class="footer-row">
      <div class="score-mini">answered: <b>${answeredCount}</b>/${QUESTIONS.length}</div>
      <div class="nav-btns">
        <button class="btn" id="backBtn" ${current === 0 ? "disabled" : ""}>← back</button>
        ${isLast
          ? `<button class="btn submit-btn" id="submitBtn">submit quiz</button>`
          : `<button class="btn next-btn" id="nextBtn">next →</button>`}
      </div>
    </div>
  `;

  document.querySelectorAll(".choice").forEach(btn => {
    btn.addEventListener("click", () => {
      answers[current] = parseInt(btn.dataset.i);
      renderQuestion();
    });
  });

  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.addEventListener("click", () => { current--; renderQuestion(); });

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", () => { current++; renderQuestion(); });

  const submitBtn = document.getElementById("submitBtn");
  if (submitBtn) submitBtn.addEventListener("click", () => {
    const unanswered = answers.filter(a => a === null).length;
    if (unanswered > 0){
      if (!confirm(`${unanswered} question(s) unanswered. Submit anyway?`)) return;
    }
    submitted = true;
    renderResults();
  });
}

function renderResults(){
  let score = 0;
  const byDiff = { LOW: [0,0], MEDIUM: [0,0], HARD: [0,0] };
  QUESTIONS.forEach((item, i) => {
    byDiff[item.difficulty][1]++;
    if (answers[i] === item.correct){
      score++;
      byDiff[item.difficulty][0]++;
    }
  });

  const pct = Math.round((score / QUESTIONS.length) * 100);
  let verdict;
  if (pct >= 90) verdict = "Excellent grasp of the Linux basics and core security concepts — you're ready to move on to more advanced material.";
  else if (pct >= 70) verdict = "Solid foundation. Review a few commands you missed and you'll be in great shape.";
  else if (pct >= 50) verdict = "You know some basics — spend more time practicing core Linux commands and security terms before moving on.";
  else verdict = "Good starting point. Revisit the fundamentals of Linux navigation and basic security concepts, then run this again.";

  document.getElementById("dot1").classList.remove("active");
  document.getElementById("dot2").classList.remove("active");
  document.getElementById("dot3").classList.remove("active");

  const rowsHTML = ["LOW","MEDIUM","HARD"].map(d => {
    const [c, t] = byDiff[d];
    const w = t ? Math.round((c/t)*100) : 0;
    return `
      <div class="brow">
        <div class="label" style="color:${diffColor[d]}">${d}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${w}%; background:${diffColor[d]}"></div></div>
        <div class="count">${c}/${t}</div>
      </div>`;
  }).join("");

  const reviewHTML = QUESTIONS.map((item, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === item.correct;
    const userLabel = userAns === null ? "— no answer —" : `[${String.fromCharCode(65+userAns)}] ${item.choices[userAns]}`;
    return `
      <div class="review-item">
        <div class="rhead">
          <span>Q${i+1} · <span class="diff-tag ${item.difficulty}">${item.difficulty}</span></span>
          <span class="${isCorrect ? 'status-ok' : 'status-bad'}">${isCorrect ? '✔ correct' : '✘ incorrect'}</span>
        </div>
        <div class="rq">${item.q}</div>
        <div class="ryour ${isCorrect ? 'status-ok' : 'status-bad'}">Your answer: ${userLabel}</div>
        ${isCorrect ? "" : `<div class="rcorrect status-ok">Correct answer: [${String.fromCharCode(65+item.correct)}] ${item.choices[item.correct]}</div>`}
        <div class="rexplain">${item.explain}</div>
      </div>`;
  }).join("");

  body.innerHTML = `
    <div class="results">
      <div class="prompt-line"><span class="path">~/quiz</span> <span class="cmd">$ ./generate_report.sh --final</span></div>
      <h2>scan complete</h2>
      <div class="sub">INSTANT-SW-Quiz — Linux Fundamentals & Cybersecurity Basics</div>
      <div class="bigscore">${score}<span> / ${QUESTIONS.length} (${pct}%)</span></div>
      <div class="breakdown">${rowsHTML}</div>
      <div class="verdict">${verdict}</div>
      <button class="review-toggle" id="reviewToggle">$ ./quiz --show-review</button>
      <div class="review-list" id="reviewList">${reviewHTML}</div>
    </div>
  `;

  document.getElementById("reviewToggle").addEventListener("click", () => {
    const list = document.getElementById("reviewList");
    const btn = document.getElementById("reviewToggle");
    const isShown = list.classList.toggle("show");
    btn.textContent = isShown ? "$ ./quiz --hide-review" : "$ ./quiz --show-review";
  });
}

renderQuestion();
</script>

</body>
</html>
